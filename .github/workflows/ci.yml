name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Regenerate synthetic trial (determinism check)
        run: |
          python data/synthetic_trial/generate_data.py
          git diff --exit-code -- data/synthetic_trial evals/gold
      - name: Unit + integration tests (offline)
        run: python -m unittest discover -s tests -v
      - name: Full autonomous demo (offline, mock backend)
        run: python run_demo.py
      - name: Demo must have improved and passed gates
        run: |
          python - <<'EOF'
          import json
          s = json.load(open("demo_summary.json"))
          assert s["score_after"] == 100.0, s
          assert s["act5_revisions"] == 0, s
          assert s["act5_decision"] == "accepted", s
          print("demo summary OK:", s)
          EOF
